<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yams Score Calculator / Calculadora de Puntos Yams</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 900px;
            width: 100%;
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            color: #667eea;
            font-size: 2em;
        }

        .lang-switch {
            display: flex;
            gap: 10px;
        }

        .lang-btn {
            padding: 8px 16px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .lang-btn.active {
            background: #667eea;
            color: white;
        }

        .lang-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .game-info {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .game-number {
            font-size: 1.5em;
            font-weight: bold;
        }

        .game-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-new-game {
            background: #27ae60;
            color: white;
        }

        .btn-new-game:hover {
            background: #229954;
            transform: translateY(-2px);
        }

        .btn-history {
            background: white;
            color: #667eea;
        }

        .btn-history:hover {
            background: #f0f0f0;
            transform: translateY(-2px);
        }

        .players {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .player-input {
            flex: 1;
            min-width: 150px;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
        }

        .add-player-btn, .reset-btn {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .add-player-btn:hover, .reset-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .reset-btn {
            background: #e74c3c;
        }

        .reset-btn:hover {
            background: #c0392b;
        }

        .scorecard {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        th, td {
            padding: 12px;
            text-align: center;
            border: 1px solid #e0e0e0;
        }

        th {
            background: #667eea;
            color: white;
            font-weight: bold;
            position: sticky;
            top: 0;
        }

        .category-name {
            text-align: left;
            font-weight: 600;
            background: #f8f9fa;
        }

        .section-header {
            background: #764ba2 !important;
            color: white;
            font-weight: bold;
        }

        .total-row {
            background: #f0f0f0;
            font-weight: bold;
        }

        .final-total {
            background: #667eea !important;
            color: white;
            font-size: 1.2em;
        }

        input[type="number"] {
            width: 80px;
            padding: 8px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            text-align: center;
            font-size: 1em;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 20px;
            max-width: 800px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideDown 0.3s;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: #667eea;
        }

        .close {
            color: #aaa;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s;
        }

        .close:hover {
            color: #000;
        }

        .history-table {
            margin-top: 20px;
        }

        .cumulative-total {
            background: #27ae60 !important;
            color: white;
            font-size: 1.3em;
        }

        .game-separator {
            background: #f39c12 !important;
            color: white;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.5em;
            }
            
            .container {
                padding: 15px;
            }
            
            input[type="number"] {
                width: 60px;
            }

            .game-info {
                text-align: center;
            }

            .game-number {
                font-size: 1.2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 id="title">Calculateur Yams</h1>
            <div class="lang-switch">
                <button class="lang-btn active" onclick="setLanguage('fr')">Français</button>
                <button class="lang-btn" onclick="setLanguage('es')">Español</button>
            </div>
        </div>

        <div class="game-info">
            <div class="game-number" id="gameNumber">Partie 1</div>
            <div class="game-actions">
                <button class="btn btn-history" onclick="showHistory()" id="historyBtn">📊 Historique</button>
                <button class="btn btn-new-game" onclick="startNewGame()" id="newGameBtn">🎲 Nouvelle Partie</button>
            </div>
        </div>

        <div class="players">
            <input type="text" class="player-input" id="player1" placeholder="Joueur 1" value="Joueur 1">
            <input type="text" class="player-input" id="player2" placeholder="Joueur 2" value="Joueur 2">
            <button class="add-player-btn" onclick="addPlayer()" id="addPlayerBtn">+ Joueur</button>
            <button class="reset-btn" onclick="resetCurrentGame()" id="resetBtn">Réinitialiser</button>
        </div>

        <div class="scorecard">
            <table id="scoreTable">
                <!-- Généré dynamiquement -->
            </table>
        </div>
    </div>

    <!-- Modal Historique -->
    <div id="historyModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="historyTitle">📊 Historique des Parties</h2>
                <span class="close" onclick="closeHistory()">&times;</span>
            </div>
            <div id="historyContent"></div>
            <button class="btn reset-btn" onclick="resetAllGames()" id="resetAllBtn" style="margin-top: 20px;">Réinitialiser tout l'historique</button>
        </div>
    </div>

    <script>
        let lang = 'fr';
        let players = ['Joueur 1', 'Joueur 2'];
        let currentGame = 1;
        let gamesHistory = {};
        
        const translations = {
            fr: {
                title: 'Calculateur Yams',
                player: 'Joueur',
                addPlayer: '+ Joueur',
                reset: 'Réinitialiser',
                game: 'Partie',
                newGame: '🎲 Nouvelle Partie',
                history: '📊 Historique',
                historyTitle: '📊 Historique des Parties',
                resetAll: 'Réinitialiser tout l\'historique',
                cumulativeTotal: 'TOTAL CUMULÉ',
                confirmNewGame: 'Voulez-vous sauvegarder la partie actuelle et commencer une nouvelle partie ?',
                confirmReset: 'Êtes-vous sûr de vouloir réinitialiser la partie actuelle ?',
                confirmResetAll: 'Êtes-vous sûr de vouloir supprimer tout l\'historique ?',
                upperSection: 'SECTION SUPÉRIEURE',
                ones: 'As (1)',
                twos: 'Deux (2)',
                threes: 'Trois (3)',
                fours: 'Quatre (4)',
                fives: 'Cinq (5)',
                sixes: 'Six (6)',
                subtotal: 'Sous-total',
                bonus: 'Bonus (si ≥ 63)',
                upperTotal: 'Total Supérieur',
                lowerSection: 'SECTION INFÉRIEURE',
                threeKind: 'Brelan',
                fourKind: 'Carré',
                fullHouse: 'Full (25 pts)',
                smallStraight: 'Petite Suite (30 pts)',
                largeStraight: 'Grande Suite (40 pts)',
                yams: 'YAMS (50 pts)',
                chance: 'Chance',
                lowerTotal: 'Total Inférieur',
                grandTotal: 'TOTAL GÉNÉRAL'
            },
            es: {
                title: 'Calculadora Yams',
                player: 'Jugador',
                addPlayer: '+ Jugador',
                reset: 'Reiniciar',
                game: 'Partida',
                newGame: '🎲 Nueva Partida',
                history: '📊 Historial',
                historyTitle: '📊 Historial de Partidas',
                resetAll: 'Reiniciar todo el historial',
                cumulativeTotal: 'TOTAL ACUMULADO',
                confirmNewGame: '¿Desea guardar la partida actual y comenzar una nueva?',
                confirmReset: '¿Está seguro de que desea reiniciar la partida actual?',
                confirmResetAll: '¿Está seguro de que desea eliminar todo el historial?',
                upperSection: 'SECCIÓN SUPERIOR',
                ones: 'Unos (1)',
                twos: 'Doses (2)',
                threes: 'Treses (3)',
                fours: 'Cuatros (4)',
                fives: 'Cincos (5)',
                sixes: 'Seises (6)',
                subtotal: 'Subtotal',
                bonus: 'Bonificación (si ≥ 63)',
                upperTotal: 'Total Superior',
                lowerSection: 'SECCIÓN INFERIOR',
                threeKind: 'Trío',
                fourKind: 'Póker',
                fullHouse: 'Full (25 pts)',
                smallStraight: 'Escalera Pequeña (30 pts)',
                largeStraight: 'Escalera Grande (40 pts)',
                yams: 'YAMS (50 pts)',
                chance: 'Suerte',
                lowerTotal: 'Total Inferior',
                grandTotal: 'TOTAL GENERAL'
            }
        };

        function setLanguage(newLang) {
            lang = newLang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            updateUI();
        }

        function updateUI() {
            const t = translations[lang];
            document.getElementById('title').textContent = t.title;
            document.getElementById('addPlayerBtn').textContent = t.addPlayer;
            document.getElementById('resetBtn').textContent = t.reset;
            document.getElementById('gameNumber').textContent = t.game + ' ' + currentGame;
            document.getElementById('newGameBtn').textContent = t.newGame;
            document.getElementById('historyBtn').textContent = t.history;
            document.getElementById('historyTitle').textContent = t.historyTitle;
            document.getElementById('resetAllBtn').textContent = t.resetAll;
            
            document.querySelectorAll('.player-input').forEach((input, i) => {
                if (!input.value || input.value === translations.fr.player + ' ' + (i+1) || input.value === translations.es.player + ' ' + (i+1)) {
                    input.value = t.player + ' ' + (i+1);
                    players[i] = t.player + ' ' + (i+1);
                }
                input.placeholder = t.player + ' ' + (i+1);
            });
            
            generateTable();
        }

        function addPlayer() {
            const playerNum = players.length + 1;
            const t = translations[lang];
            const newPlayer = t.player + ' ' + playerNum;
            players.push(newPlayer);
            
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'player-input';
            input.id = 'player' + playerNum;
            input.placeholder = newPlayer;
            input.value = newPlayer;
            input.onchange = (e) => updatePlayerName(playerNum - 1, e.target.value);
            
            const container = document.querySelector('.players');
            container.insertBefore(input, document.getElementById('addPlayerBtn'));
            generateTable();
        }

        function updatePlayerName(index, name) {
            players[index] = name || translations[lang].player + ' ' + (index + 1);
            generateTable();
        }

        function generateTable() {
            const t = translations[lang];
            const table = document.getElementById('scoreTable');
            
            let html = '<thead><tr><th>' + t.upperSection + '</th>';
            players.forEach(p => html += '<th>' + p + '</th>');
            html += '</tr></thead><tbody>';
            
            const upperCategories = [
                {id: 'ones', name: t.ones},
                {id: 'twos', name: t.twos},
                {id: 'threes', name: t.threes},
                {id: 'fours', name: t.fours},
                {id: 'fives', name: t.fives},
                {id: 'sixes', name: t.sixes}
            ];
            
            upperCategories.forEach(cat => {
                html += '<tr><td class="category-name">' + cat.name + '</td>';
                players.forEach((p, i) => {
                    html += '<td><input type="number" min="0" id="' + cat.id + '_' + i + '" onchange="calculate()"></td>';
                });
                html += '</tr>';
            });
            
            html += '<tr class="total-row"><td class="category-name">' + t.subtotal + '</td>';
            players.forEach((p, i) => html += '<td id="subtotal_' + i + '">0</td>');
            html += '</tr>';
            
            html += '<tr class="total-row"><td class="category-name">' + t.bonus + '</td>';
            players.forEach((p, i) => html += '<td id="bonus_' + i + '">0</td>');
            html += '</tr>';
            
            html += '<tr class="total-row"><td class="category-name">' + t.upperTotal + '</td>';
            players.forEach((p, i) => html += '<td id="uppertotal_' + i + '">0</td>');
            html += '</tr>';
            
            html += '<tr><th class="section-header">' + t.lowerSection + '</th>';
            players.forEach(() => html += '<th class="section-header"></th>');
            html += '</tr>';
            
            const lowerCategories = [
                {id: 'three', name: t.threeKind},
                {id: 'four', name: t.fourKind},
                {id: 'full', name: t.fullHouse},
                {id: 'small', name: t.smallStraight},
                {id: 'large', name: t.largeStraight},
                {id: 'yams', name: t.yams},
                {id: 'chance', name: t.chance}
            ];
            
            lowerCategories.forEach(cat => {
                html += '<tr><td class="category-name">' + cat.name + '</td>';
                players.forEach((p, i) => {
                    html += '<td><input type="number" min="0" id="' + cat.id + '_' + i + '" onchange="calculate()"></td>';
                });
                html += '</tr>';
            });
            
            html += '<tr class="total-row"><td class="category-name">' + t.lowerTotal + '</td>';
            players.forEach((p, i) => html += '<td id="lowertotal_' + i + '">0</td>');
            html += '</tr>';
            
            html += '<tr class="final-total"><td class="category-name">' + t.grandTotal + '</td>';
            players.forEach((p, i) => html += '<td id="grandtotal_' + i + '">0</td>');
            html += '</tr>';
            
            html += '</tbody>';
            table.innerHTML = html;
            
            loadCurrentGame();
        }

        function calculate() {
            players.forEach((p, i) => {
                let subtotal = 0;
                ['ones', 'twos', 'threes', 'fours', 'fives', 'sixes'].forEach(cat => {
                    const val = parseInt(document.getElementById(cat + '_' + i)?.value) || 0;
                    subtotal += val;
                });
                
                document.getElementById('subtotal_' + i).textContent = subtotal;
                
                const bonus = subtotal >= 63 ? 35 : 0;
                document.getElementById('bonus_' + i).textContent = bonus;
                
                const upperTotal = subtotal + bonus;
                document.getElementById('uppertotal_' + i).textContent = upperTotal;
                
                let lowerTotal = 0;
                ['three', 'four', 'full', 'small', 'large', 'yams', 'chance'].forEach(cat => {
                    const val = parseInt(document.getElementById(cat + '_' + i)?.value) || 0;
                    lowerTotal += val;
                });
                
                document.getElementById('lowertotal_' + i).textContent = lowerTotal;
                
                const grandTotal = upperTotal + lowerTotal;
                document.getElementById('grandtotal_' + i).textContent = grandTotal;
            });
            
            saveCurrentGame();
        }

        function saveCurrentGame() {
            const gameData = {};
            players.forEach((p, i) => {
                gameData[p] = {
                    scores: {},
                    total: parseInt(document.getElementById('grandtotal_' + i)?.textContent) || 0
                };
                
                ['ones', 'twos', 'threes', 'fours', 'fives', 'sixes', 'three', 'four', 'full', 'small', 'large', 'yams', 'chance'].forEach(cat => {
                    const val = document.getElementById(cat + '_' + i)?.value;
                    if (val) gameData[p].scores[cat] = val;
                });
            });
            
            gamesHistory[currentGame] = gameData;
        }

        function loadCurrentGame() {
            if (gamesHistory[currentGame]) {
                const gameData = gamesHistory[currentGame];
                players.forEach((p, i) => {
                    if (gameData[p]) {
                        Object.keys(gameData[p].scores).forEach(cat => {
                            const input = document.getElementById(cat + '_' + i);
                            if (input) input.value = gameData[p].scores[cat];
                        });
                    }
                });
                calculate();
            }
        }

        function startNewGame() {
            const t = translations[lang];
            saveCurrentGame();
            currentGame++;
            document.getElementById('gameNumber').textContent = t.game + ' ' + currentGame;
            document.querySelectorAll('input[type="number"]').forEach(input => input.value = '');
            calculate();
        }

        function resetCurrentGame() {
            const t = translations[lang];
            if (confirm(t.confirmReset)) {
                document.querySelectorAll('input[type="number"]').forEach(input => input.value = '');
                calculate();
            }
        }

        function showHistory() {
            const t = translations[lang];
            const modal = document.getElementById('historyModal');
            const content = document.getElementById('historyContent');
            
            if (Object.keys(gamesHistory).length === 0) {
                content.innerHTML = '<p style="text-align: center; color: #999; padding: 40px;">Aucune partie sauvegardée</p>';
            } else {
                let html = '<table class="history-table"><thead><tr><th>' + t.game + '</th>';
                players.forEach(p => html += '<th>' + p + '</th>');
                html += '</tr></thead><tbody>';
                
                const cumulativeTotals = {};
                players.forEach(p => cumulativeTotals[p] = 0);
                
                Object.keys(gamesHistory).sort((a, b) => parseInt(a) - parseInt(b)).forEach(gameNum => {
                    const gameData = gamesHistory[gameNum];
                    html += '<tr class="game-separator"><td>' + t.game + ' ' + gameNum + '</td>';
                    players.forEach(p => {
                        const score = gameData[p]?.total || 0;
                        cumulativeTotals[p] += score;
                        html += '<td>' + score + '</td>';
                    });
                    html += '</tr>';
                });
                
                html += '<tr class="cumulative-total"><td>' + t.cumulativeTotal + '</td>';
                players.forEach(p => html += '<td>' + cumulativeTotals[p] + '</td>');
                html += '</tr>';
                
                html += '</tbody></table>';
                content.innerHTML = html;
            }
            
            modal.style.display = 'block';
        }

        function closeHistory() {
            document.getElementById('historyModal').style.display = 'none';
        }

        function resetAllGames() {
            const t = translations[lang];
            if (confirm(t.confirmResetAll)) {
                gamesHistory = {};
                currentGame = 1;
                document.getElementById('gameNumber').textContent = t.game + ' ' + currentGame;
                document.querySelectorAll('input[type="number"]').forEach(input => input.value = '');
                calculate();
                closeHistory();
            }
        }

        window.onclick = function(event) {
            const modal = document.getElementById('historyModal');
            if (event.target == modal) {
                closeHistory();
            }
        }

        document.querySelectorAll('.player-input').forEach((input, i) => {
            input.onchange = (e) => updatePlayerName(i, e.target.value);
        });
        
        generateTable();
    </script>
</body>
</html>
